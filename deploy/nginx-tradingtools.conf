# /etc/nginx/sites-available/tradingtools (enabled via the symlink in sites-enabled).
# e-tradingtools.de -> the Blazor app on port 5001. HTTPS with the Let's Encrypt certificate that certbot
# manages (it renews by itself); plain HTTP is redirected to HTTPS.

# Blazor's live connection is a WebSocket: pass the upgrade through, keep normal requests keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    server_name e-tradingtools.de www.e-tradingtools.de;

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/e-tradingtools.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/e-tradingtools.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Screenshots uploaded on the Trades / New Trade pages go over the WebSocket, not a request body.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        # An idle Blazor connection must not be cut after nginx's default 60s.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Backup page: database dumps and screenshot zips can be hundreds of MB (docs/VPS-SETUP.md).
    location /backup/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 2G;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name e-tradingtools.de www.e-tradingtools.de;
    return 301 https://$host$request_uri;
}
